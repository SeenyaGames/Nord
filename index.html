<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nord</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nord">
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#38bdf8;--text:#e2e8f0;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;padding-bottom:96px}
h1{font-size:22px}
.sub{color:var(--muted);font-size:13px;margin:4px 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:12px;border-radius:12px;background:var(--card);color:var(--muted);text-align:center;font-weight:600;border:0}
.tab.on{background:var(--accent);color:#0f172a}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.card h3{font-size:15px}
.card p{font-size:13px;color:var(--muted);margin-top:4px}
.badge{display:inline-block;margin-top:8px;font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(56,189,248,.15);color:var(--accent)}
.badge.ok{background:rgba(34,197,94,.15);color:#4ade80}
.empty{text-align:center;color:var(--muted);padding:36px 0}
.add{position:fixed;left:16px;right:16px;bottom:20px;padding:14px;border:0;border-radius:14px;background:var(--accent);color:#0f172a;font-weight:700}
.del{float:right;background:0;border:0;color:#f87171;font-size:22px;line-height:1}
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);padding:20px;align-items:flex-end}
.mask.on{display:flex}
.form{background:var(--card);width:100%;border-radius:16px;padding:16px}
.form h2{font-size:16px;margin-bottom:12px}
input{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:var(--text);font-size:16px}
.row{display:flex;gap:8px}
.row button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:700}
.ok{background:var(--accent);color:#0f172a}
.cancel{background:#334155;color:var(--text)}
</style>
</head>
<body>
<h1>Nord</h1>
<p class="sub">Rendez-vous et objectifs</p>
<div class="tabs">
<button class="tab on" id="t1" type="button">Rendez-vous</button>
<button class="tab" id="t2" type="button">Objectifs</button>
</div>
<div id="list"></div>
<button class="add" id="add" type="button">+ Ajouter</button>
<div class="mask" id="mask">
  <form class="form" id="form">
    <h2 id="ftitle">Nouveau rendez-vous</h2>
    <input id="title" placeholder="Titre" required>
    <input id="when" placeholder="Date (AAAA-MM-JJ)">
    <input id="time" placeholder="Heure (HH:MM)">
    <input id="note" placeholder="Note (facultatif)">
    <div class="row">
      <button class="cancel" id="cancel" type="button">Annuler</button>
      <button class="ok" type="submit">Enregistrer</button>
    </div>
  </form>
</div>
<script>
const KEY="nord_v3";
let tab="rdv";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{rdv:[],obj:[]};
if(!Array.isArray(data.rdv)) data.rdv=[];
if(!Array.isArray(data.obj)) data.obj=[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const list=document.getElementById("list");
const mask=document.getElementById("mask");
function draw(){
  const items=tab==="rdv"?data.rdv:data.obj;
  if(!items.length){list.innerHTML='<p class="empty">Rien pour le moment.</p>';return;}
  list.innerHTML=items.map((x,i)=>tab==="rdv"
    ?`<div class="card"><button class="del" data-i="\( {i}" type="button">×</button><h3> \){x.title}</h3><p>${x.date||""} \( {x.time||""}</p> \){x.note?`<p>${x.note}</p>`:""}</div>`
    :`<div class="card"><button class="del" data-i="\( {i}" type="button">×</button><h3> \){x.title}</h3><p>${x.deadline||"Sans échéance"}</p><span class="badge \( {x.done?"ok":""}" data-t=" \){i}">${x.done?"Atteint":"En cours"}</span></div>`
  ).join("");
}
function openForm(){
  document.getElementById("ftitle").textContent=tab==="rdv"?"Nouveau rendez-vous":"Nouvel objectif";
  document.getElementById("title").value="";
  document.getElementById("when").value="";
  document.getElementById("time").value="";
  document.getElementById("note").value="";
  document.getElementById("time").style.display=tab==="rdv"?"":"none";
  document.getElementById("note").style.display=tab==="rdv"?"":"none";
  document.getElementById("when").placeholder=tab==="rdv"?"Date (AAAA-MM-JJ)":"Échéance (AAAA-MM-JJ)";
  mask.classList.add("on");
  document.getElementById("title").focus();
}
document.getElementById("t1").onclick=()=>{tab="rdv";document.getElementById("t1").classList.add("on");document.getElementById("t2").classList.remove("on");draw();};
document.getElementById("t2").onclick=()=>{tab="obj";document.getElementById("t2").classList.add("on");document.getElementById("t1").classList.remove("on");draw();};
document.getElementById("add").onclick=openForm;
document.getElementById("cancel").onclick=()=>mask.classList.remove("on");
document.getElementById("form").onsubmit=(e)=>{
  e.preventDefault();
  const title=document.getElementById("title").value.trim();
  if(!title) return;
  if(tab==="rdv") data.rdv.push({title,date:document.getElementById("when").value,time:document.getElementById("time").value,note:document.getElementById("note").value});
  else data.obj.push({title,deadline:document.getElementById("when").value,done:false});
  save();mask.classList.remove("on");draw();
};
list.onclick=(e)=>{
  const del=e.target.closest(".del");
  if(del){(tab==="rdv"?data.rdv:data.obj).splice(+del.dataset.i,1);save();draw();return;}
  const b=e.target.closest(".badge");
  if(b){data.obj[+b.dataset.t].done=!data.obj[+b.dataset.t].done;save();draw();}
};
draw();
</script>
</body>
</html>
